
<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Banking</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0b1420, #1d3b59);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }


        /* =========================
           LOGIN PAGE
        ========================= */

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.45);
            text-align: center;
        }

        .bank-icon {
            width: 75px;
            height: 75px;
            margin: auto;
            border-radius: 50%;
            background: linear-gradient(145deg, #1c4668, #0b263f);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }

        .login-container h1 {
            margin-top: 18px;
            color: #142d45;
            font-size: 30px;
            letter-spacing: 1px;
        }

        .secure-login {
            margin-top: 7px;
            margin-bottom: 28px;
            color: #7a8793;
            font-size: 12px;
            letter-spacing: 3px;
        }

        .input-box {
            text-align: left;
            margin-bottom: 18px;
        }

        .input-box label {
            display: block;
            margin-bottom: 7px;
            font-size: 12px;
            font-weight: bold;
            color: #4e5d6c;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #d5dce2;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #1c527d;
            box-shadow: 0 0 0 3px rgba(28,82,125,0.1);
        }

        .login-button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #17466b, #102d48);
            color: white;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .login-button:hover {
            opacity: 0.9;
        }

        #loginMessage {
            color: #c62828;
            font-size: 13px;
            margin-top: 15px;
        }

        .security-note {
            margin-top: 22px;
            color: #8995a1;
            font-size: 11px;
        }


        /* =========================
           ATM DASHBOARD
        ========================= */

        .atm-container {
            display: none;
            width: 100%;
            max-width: 950px;
            background: #f3f5f7;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 25px 70px rgba(0,0,0,0.5);
        }


        /* HEADER */

        .header {
            background: linear-gradient(135deg, #173d5c, #0e263d);
            color: white;
            padding: 25px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 25px;
            letter-spacing: 2px;
        }

        .header-right {
            text-align: right;
        }

        .header-right strong {
            display: block;
            font-size: 12px;
        }

        .header-right span {
            font-size: 11px;
            color: #b7c5d2;
        }


        /* CONTENT */

        .content {
            padding: 35px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            color: #173d5c;
            margin-bottom: 6px;
            font-size: 24px;
        }

        .welcome p {
            color: #7b8792;
            font-size: 15px;
        }


        /* BALANCE */

        .balance-card {
            background: linear-gradient(135deg, #173d5c, #0c243b);
            color: white;
            padding: 32px;
            border-radius: 14px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(14,38,61,0.25);
        }

        .balance-label {
            font-size: 13px;
            letter-spacing: 2px;
            color: #b7c9d8;
            margin-bottom: 10px;
        }

        .balance {
            font-size: 42px;
            font-weight: bold;
        }


        /* SERVICES */

        .menu-title {
            color: #173d5c;
            font-size: 19px;
            margin-bottom: 15px;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .atm-button {
            padding: 21px;
            background: white;
            border: 1px solid #dce1e5;
            border-radius: 11px;
            color: #173d5c;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .atm-button:hover {
            background: #173d5c;
            color: white;
            transform: translateY(-2px);
        }


        /* TRANSACTION */

        .transaction-box {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 11px;
            border: 1px solid #dce1e5;
        }

        .transaction-box h3 {
            color: #173d5c;
            margin-bottom: 12px;
        }

        .transaction-box input {
            margin-bottom: 10px;
        }

        .confirm-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #238b45;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }


        /* MESSAGE */

        #message {
            margin-top: 20px;
            padding: 16px;
            background: white;
            border-radius: 9px;
            border: 1px solid #dce1e5;
            text-align: center;
            color: #4b5865;
            min-height: 50px;
            font-size: 14px;
        }


        /* LOGOUT */

        .logout {
            width: 100%;
            margin-top: 18px;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #a52a24;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 700px) {

            body {
                padding: 12px;
                align-items: flex-start;
            }

            .login-container {
                margin-top: 30px;
                padding: 30px 25px;
            }

            .atm-container {
                width: 100%;
                min-height: calc(100vh - 24px);
                border-radius: 14px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 20px;
            }

            .header-right strong {
                font-size: 10px;
            }

            .content {
                padding: 22px;
            }

            .balance-card {
                padding: 25px;
            }

            .balance {
                font-size: 34px;
            }

            .buttons {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .atm-button {
                padding: 20px;
                font-size: 15px;
            }
        }


        /* =========================
           SMALL PHONE
        ========================= */

        @media (max-width: 450px) {

            body {
                padding: 0;
                display: block;
            }

            .login-container {
                width: 92%;
                margin: 35px auto;
                padding: 30px 22px;
                border-radius: 15px;
            }

            .bank-icon {
                width: 65px;
                height: 65px;
                font-size: 17px;
            }

            .login-container h1 {
                font-size: 25px;
            }

            .atm-container {
                width: 100%;
                min-height: 100vh;
                border-radius: 0;
            }

            .header {
                padding: 18px;
            }

            .header h1 {
                font-size: 18px;
                letter-spacing: 1px;
            }

            .header-right {
                display: none;
            }

            .content {
                padding: 18px;
            }

            .welcome h2 {
                font-size: 21px;
            }

            .welcome p {
                font-size: 13px;
            }

            .balance-card {
                padding: 24px 20px;
                margin-bottom: 25px;
            }

            .balance-label {
                font-size: 11px;
            }

            .balance {
                font-size: 31px;
            }

            .menu-title {
                font-size: 17px;
            }

            .atm-button {
                padding: 18px;
                font-size: 14px;
            }

            .transaction-box {
                padding: 17px;
            }

            #message {
                font-size: 13px;
            }

            .logout {
                margin-bottom: 20px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================
         LOGIN
    ========================== -->

    <div class="login-container" id="loginPage">

        <div class="bank-icon">
            ATM
        </div>

        <h1>ATM BANKING</h1>

        <p class="secure-login">
            SECURE LOGIN
        </p>


        <div class="input-box">

            <label>USERNAME</label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
            >

        </div>


        <div class="input-box">

            <label>PASSWORD</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
            >

        </div>


        <button
            class="login-button"
            onclick="login()"
        >
            LOGIN
        </button>


        <p id="loginMessage"></p>


        <p class="security-note">
            🔒 Secure banking session
        </p>

    </div>



    <!-- =========================
         ATM DASHBOARD
    ========================== -->

    <div class="atm-container" id="atmMenu">


        <div class="header">

            <h1>ATM BANKING</h1>

            <div class="header-right">

                <strong>SECURE ATM SYSTEM</strong>

                <span>Banking Services</span>

            </div>

        </div>


        <div class="content">


            <div class="welcome">

                <h2>
                    Welcome, <span id="displayUsername"></span>
                </h2>

                <p>
                    Select a banking service below.
                </p>

            </div>


            <!-- BALANCE -->

            <div class="balance-card">

                <div class="balance-label">
                    AVAILABLE SAVINGS
                </div>

                <div class="balance">
                    ₱<span id="balance">1,000.00</span>
                </div>

            </div>


            <!-- SERVICES -->

            <h3 class="menu-title">
                BANKING SERVICES
            </h3>


            <div class="buttons">

                <button
                    class="atm-button"
                    onclick="showDeposit()"
                >
                    💰 &nbsp; DEPOSIT
                </button>


                <button
                    class="atm-button"
                    onclick="showWithdraw()"
                >
                    💸 &nbsp; WITHDRAW
                </button>


                <button
                    class="atm-button"
                    onclick="checkSavings()"
                >
                    💳 &nbsp; CHECK SAVINGS
                </button>


                <button
                    class="atm-button"
                    onclick="clearMessage()"
                >
                    ↻ &nbsp; CLEAR
                </button>

            </div>


            <!-- TRANSACTION -->

            <div
                class="transaction-box"
                id="transactionBox"
            >

                <h3 id="transactionTitle">
                    Transaction
                </h3>

                <input
                    type="number"
                    id="transactionAmount"
                    placeholder="Enter amount"
                    min="1"
                >

                <button
                    class="confirm-button"
                    onclick="confirmTransaction()"
                >
                    CONFIRM TRANSACTION
                </button>

            </div>


            <!-- MESSAGE -->

            <div id="message">
                Select a banking service above.
            </div>


            <!-- LOGOUT -->

            <button
                class="logout"
                onclick="logout()"
            >
                LOGOUT
            </button>

        </div>

    </div>



    <script>

        // LOGIN INFORMATION

        let correctUsername = "Karli";
        let correctPassword = "143";


        // STARTING SAVINGS

        let savings = 1000;


        // TRANSACTION TYPE

        let transactionType = "";


        // LOGIN

        function login() {

            let username =
                document.getElementById("username").value;

            let password =
                document.getElementById("password").value;


            if (
                username === correctUsername &&
                password === correctPassword
            ) {

                document.getElementById("loginPage")
                    .style.display = "none";

                document.getElementById("atmMenu")
                    .style.display = "block";

                document.getElementById("displayUsername")
                    .textContent = username;

                updateBalance();

            }

            else {

                document.getElementById("loginMessage")
                    .textContent =
                    "Incorrect username or password.";

            }

        }


        // DEPOSIT SCREEN

        function showDeposit() {

            transactionType = "deposit";

            document.getElementById("transactionTitle")
                .textContent = "Deposit Money";

            document.getElementById("transactionAmount")
                .value = "";

            document.getElementById("transactionBox")
                .style.display = "block";

        }


        // WITHDRAW SCREEN

        function showWithdraw() {

            transactionType = "withdraw";

            document.getElementById("transactionTitle")
                .textContent = "Withdraw Money";

            document.getElementById("transactionAmount")
                .value = "";

            document.getElementById("transactionBox")
                .style.display = "block";

        }


        // CONFIRM TRANSACTION

        function confirmTransaction() {

            let amount =
                Number(
                    document.getElementById(
                        "transactionAmount"
                    ).value
                );


            if (amount <= 0) {

                showMessage(
                    "Please enter a valid amount."
                );

                return;
            }


            // DEPOSIT

            if (transactionType === "deposit") {

                savings = savings + amount;

                updateBalance();

                showMessage(
                    "✓ Deposit successful. ₱" +
                    amount.toFixed(2) +
                    " added to your savings."
                );

            }


            // WITHDRAW

            else if (transactionType === "withdraw") {

                if (amount > savings) {

                    showMessage(
                        "✕ Transaction declined. " +
                        "Insufficient savings."
                    );

                    return;
                }


                savings = savings - amount;

                updateBalance();

                showMessage(
                    "✓ Withdrawal successful. ₱" +
                    amount.toFixed(2) +
                    " withdrawn."
                );

            }


            document.getElementById("transactionBox")
                .style.display = "none";

        }


        // CHECK SAVINGS

        function checkSavings() {

            showMessage(
                "Your current available savings is ₱" +
                savings.toFixed(2)
            );

        }


        // UPDATE BALANCE

        function updateBalance() {

            document.getElementById("balance")
                .textContent =
                savings.toLocaleString(
                    "en-PH",
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                );

        }


        // MESSAGE

        function showMessage(text) {

            document.getElementById("message")
                .textContent = text;

        }


        // CLEAR

        function clearMessage() {

            document.getElementById("transactionBox")
                .style.display = "none";

            document.getElementById("message")
                .textContent =
                "Select a banking service above.";

        }


        // LOGOUT

        function logout() {

            document.getElementById("atmMenu")
                .style.display = "none";

            document.getElementById("loginPage")
                .style.display = "block";

            document.getElementById("username")
                .value = "";

            document.getElementById("password")
                .value = "";

            document.getElementById("loginMessage")
                .textContent = "";

        }

    </script>

</body>
</html>
